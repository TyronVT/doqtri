[workspace]
resolver = "2"
members = ["contract"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# ed25519-dalek 3.x broke CryptoRng vs ChaCha20Rng used by soroban-env-host 22.
# Force the whole workspace onto 2.2.0.
[patch.crates-io]
ed25519-dalek = { path = "vendor/ed25519-dalek" }
